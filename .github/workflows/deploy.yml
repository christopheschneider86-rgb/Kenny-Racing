name: "Deploy to GitHub Pages"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export_web:
    runs-on: ubuntu-latest
    name: Export to Web
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set Permissions & Safe Directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chmod -R ugo+rwX "$GITHUB_WORKSPACE"

      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/4.3.stable
          mkdir -v -p ~/.config/
          cp -r /root/.config/godot ~/.config/ 2>/dev/null || true
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ 2>/dev/null || true
          if [ ! -f ~/.local/share/godot/export_templates/4.3.stable/web_release.zip ] || [ ! -f ~/.local/share/godot/export_templates/4.3.stable/web_nothreads_release.zip ]; then
            echo "Web export templates missing or incomplete! Downloading official templates..."
            GODOT_VERSION=4.3-stable
            wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
            unzip -q -o Godot_v${GODOT_VERSION}_export_templates.tpz
            mv templates/* ~/.local/share/godot/export_templates/4.3.stable/
            rm -f Godot_v${GODOT_VERSION}_export_templates.tpz
          fi
          echo "Templates in 4.3.stable:"
          ls -la ~/.local/share/godot/export_templates/4.3.stable/web* || true

      - name: Import Assets
        run: |
          godot --headless --editor --quit-after 100 || godot --headless --import || true

      - name: Web Export
        run: |
          mkdir -v -p build/web
          godot --headless --verbose --export-release "Web" build/web/index.html
          # Inject cache-busting meta tags into index.html
          sed -i 's/<head>/<head><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" \/><meta http-equiv="Pragma" content="no-cache" \/><meta http-equiv="Expires" content="0" \/>/' build/web/index.html
          # Guarantee Browser Tab Title is "Kenny racing"
          sed -i 's/<title>.*<\/title>/<title>Kenny racing<\/title>/' build/web/index.html
          # Clean up any leftover Starter Kit references
          sed -i 's/Starter Kit Racing/Kenny racing/gI' build/web/index.html || true
          sed -i 's/Starter Kit/Kenny racing/gI' build/web/index.html || true

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export_web
    runs-on: ubuntu-latest
    name: Deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
