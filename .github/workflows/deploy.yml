name: "Deploy to GitHub Pages"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export_web:
    runs-on: ubuntu-latest
    name: Export to Web
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/4.3.stable
          if [ ! -f ~/.local/share/godot/export_templates/4.3.stable/web_release.zip ] && [ ! -f ~/.local/share/godot/export_templates/4.3.stable/web_nothreads_release.zip ]; then
            echo "Downloading Godot 4.3 export templates..."
            GODOT_VERSION=4.3-stable
            wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
            unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
            mv templates/* ~/.local/share/godot/export_templates/4.3.stable/
            rm -f Godot_v${GODOT_VERSION}_export_templates.tpz
          else
            echo "Export templates already present in image."
          fi

      - name: Web Export
        run: |
          mkdir -v -p build/web
          godot --headless --verbose --export-release "Web" build/web/index.html

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export_web
    runs-on: ubuntu-latest
    name: Deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
